<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechCart — Tienda de electrónica</title>
    <link rel="stylesheet" href="./css/styles.css" />

    <!-- Tailwind v4 en el navegador, sin build -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        </head>
    
        <body class="bg-fondo text-texto">

            <header class="sticky top-0 z-10 flex justify-between items-center flex-wrap gap-4 bg-tarjeta py-4 px-5 rounded-xl">
                <h1 class="text-2xl font-bold text-marca m-0">TechCart — Promociones</h1>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-texto-suave">Deseos:</span>
                    <strong class="contador-deseos">0</strong>
                </div>
            </header>

            <main class="p-6">
                <section id="catalogo">
                    <h2 class="text-2xl font-semibold mb-4">Promociones</h2>
                    <div class="productos grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-4 gap-y-8"></div>
                </section>
            </main>

            <footer class="p-6 text-sm text-texto-suave">
                <p>Promociones — proyecto educativo</p>
            </footer>

            <script type="module" src="js/main.js"></script>
        </body>
</html>
